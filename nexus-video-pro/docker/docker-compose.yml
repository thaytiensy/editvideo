version: '3.9'

services:
  # 1. Redis for BullMQ & Caching
  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nexus-net

  # 2. MinIO S3-Compatible Object Storage
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: nexus-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - nexus-net

  # 3. Fastify Backend & BullMQ Render Worker
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    container_name: nexus-server
    restart: unless-stopped
    depends_on:
      - redis
      - minio
    environment:
      NODE_ENV: production
      PORT: 8000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET_NAME: nexus-video-renders
      AI_ENGINE_URL: http://ai-engine:8001
    ports:
      - "8000:8000"
    networks:
      - nexus-net

  # 4. Python AI Engine & Pipeline Gateway (CUDA GPU Accelerated)
  ai-engine:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ai-engine
    container_name: nexus-ai-engine
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      PORT: 8001
      USE_LOCAL_CUDA: "true"
      FAL_KEY: ${FAL_KEY}
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN}
    ports:
      - "8001:8001"
    volumes:
      - model_weights:/app/models
    networks:
      - nexus-net

  # 5. Next.js 15 Web Frontend
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: nexus-web
    restart: unless-stopped
    depends_on:
      - server
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
    ports:
      - "3000:3000"
    networks:
      - nexus-net

networks:
  nexus-net:
    driver: bridge

volumes:
  redis_data:
  minio_data:
  model_weights:
